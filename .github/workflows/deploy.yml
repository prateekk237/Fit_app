name: Build & Deploy Fit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fit-pwa

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pre-deploy AssetShield health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://assetshield.co.in)
          echo "AssetShield status: $STATUS"
          case "$STATUS" in
            200|301|302) echo "ok" ;;
            *) echo "AssetShield unhealthy ($STATUS). Aborting deploy."; exit 1 ;;
          esac

      - name: Pre-deploy VPS RAM check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            AVAIL=$(free -m | awk '/^Mem:/ {print $7}')
            echo "Free RAM: ${AVAIL}MB"
            if [ "$AVAIL" -lt 700 ]; then
              echo "Insufficient RAM (${AVAIL}MB < 700). Aborting."
              exit 1
            fi

      - name: Deploy — pull, migrate, swap
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 300s
          script: |
            set -e
            cd /home/deploy/apps/fit
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull fit-app fit-migrate
            docker compose -f docker-compose.prod.yml run --rm fit-migrate
            docker compose -f docker-compose.prod.yml up -d --no-deps fit-app
            docker image prune -f
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:3100/api/health > /dev/null; then
                echo "Fit healthy"; exit 0
              fi
              sleep 3
            done
            echo "Fit failed to become healthy"; exit 1

      - name: Post-deploy verification (both apps)
        run: |
          sleep 10
          ASSET=$(curl -s -o /dev/null -w "%{http_code}" https://assetshield.co.in)
          FIT=$(curl -s -o /dev/null -w "%{http_code}" https://fit.assetshield.co.in)
          echo "AssetShield: $ASSET"
          echo "Fit:          $FIT"
          case "$ASSET" in
            200|301|302) ;;
            *) echo "CRITICAL: AssetShield broke after Fit deploy"; exit 1 ;;
          esac
          case "$FIT" in
            200|301|302) ;;
            *) echo "Fit subdomain not responding (${FIT})"; exit 1 ;;
          esac
