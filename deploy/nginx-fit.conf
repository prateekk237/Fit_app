# /etc/nginx/sites-available/fit.assetshield.co.in
#
# Keep this file separate from AssetShield's. Never edit AssetShield's
# server blocks — if we break that, we've failed the "coexist" goal.
#
# Copy → symlink → test → reload:
#   sudo cp deploy/nginx-fit.conf /etc/nginx/sites-available/fit.assetshield.co.in
#   sudo ln -s /etc/nginx/sites-available/fit.assetshield.co.in /etc/nginx/sites-enabled/
#   sudo nginx -t    # MUST pass
#   sudo systemctl reload nginx
#
# Prereq: DNS A record fit.assetshield.co.in → VPS_IP (Cloudflare proxy OFF)
#   + Let's Encrypt cert issued via certbot --nginx -d fit.assetshield.co.in

# Rate-limit the expensive AI photo endpoint to 10 req/min/IP.
limit_req_zone $binary_remote_addr zone=fit_ai:10m rate=10r/m;

# HTTP → HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name fit.assetshield.co.in;
    return 301 https://$host$request_uri;
}

# HTTPS vhost.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fit.assetshield.co.in;

    ssl_certificate     /etc/letsencrypt/live/fit.assetshield.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.assetshield.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/json application/javascript
        application/xml image/svg+xml application/manifest+json;

    client_max_body_size 16M;   # photo uploads can push ~ 10 MB original

    # ── Service worker must not be cached ────────────────────────────────
    location = /sw.js {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /push-handler.js {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── Manifest + immutable static assets ───────────────────────────────
    location = /manifest.json {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /icons/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location /exercises/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Rate-limited AI photo endpoint ───────────────────────────────────
    location = /api/food-logs/photo {
        limit_req zone=fit_ai burst=3 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Everything else (page + API) ─────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off; # Next.js streams RSC; avoid buffering.
    }
}
